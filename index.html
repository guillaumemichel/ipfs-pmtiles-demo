<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <title>Verified PMTiles Globe with 3D Terrain</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no'>
    <!-- maplibre + pmtiles: exact versions, SRI-pinned. The verified client is
         the vendored veritiles bundle (self-contained ESM, no CDN deps) that
         `npm run build` copies to vendor/ next to this page. -->
    <script src='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js'
            integrity='sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp'
            crossorigin='anonymous'></script>
    <link href='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css'
          integrity='sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK'
          crossorigin='anonymous' rel='stylesheet' />
    <script src='https://unpkg.com/pmtiles@4.4.1/dist/pmtiles.js'
            integrity='sha384-iS2/cbFYol4NsEeda4mW6N/8wPMOT6pv2eY+GNYSJRqVC4nbJECP1+mg6D2T8wT/'
            crossorigin='anonymous'></script>
    <script type='importmap'>
    {
        "imports": {
            "veritiles": "./vendor/veritiles.js"
        }
    }
    </script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; background: #000; }
        #badge {
            position: absolute; top: 10px; right: 10px; z-index: 1;
            background: rgba(255, 255, 255, 0.9); border-radius: 4px;
            padding: 6px 10px; font: 13px/1.4 monospace; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
        }
        #badge .rejected { color: #c0392b; }
    </style>
</head>
<body>
    <div id='map'></div>
    <div id='badge'>loading…</div>
    <script type='module'>
        import { VerifiedSource, VerifiedAsset, assetProtocol } from 'veritiles';

        // The four CIDs are the only trust anchors. File locations are
        // untrusted and can be replaced with the host query parameters below.
        // `npm run build` checks these anchors against packaged artifacts.
        const config = {
            map:       'bafyreifxbxeu4m3xedbpgq5tx4k4ud4j2wxcpikg5dyzdxdhhy6zvcwo3u',
            elevation: 'bafyreiacny7rdvqj32fil5yxzvcurg6xb5bnhxn3zt53lemoala23x2hai',
            fonts:     'bafyreigr3kszmxht36pxnoddfdraxqnyy4x7ylnqyfnubenpdyqftozamm',
            style:     'STYLE_CID',
        };

        // ?source= / ?elevation= / ?fonts= / ?style=<host> try another host
        // first for that artifact, then the same-origin packaged copy.
        // ?tamper=1 corrupts a deterministic ~1/6 of tile (range) responses
        // and a deterministic ~1/6 of glyph (.pbf) responses — sparing the
        // single-sourced style body and every .car proof — to show that
        // tampered bytes are rejected, never rendered.
        const params = new URLSearchParams(location.search);
        const tamper = params.has('tamper');
        const sources = (key, path) => params.has(key)
            ? [`${params.get(key).replace(/\/+$/, '')}/${path}`, path]
            : [path];

        // Deterministic corruption so a retry / failover cannot mask it. Tiles
        // key on their byte offset (offset 0 is the bootstrap run, always
        // spared so the map comes up); glyphs key on their URL.
        const corruptTile = (start) =>
            start !== 0 && (Math.imul(start, 2654435761) >>> 0) % 6 === 0;
        const hashUrl = (s) => {
            let h = 2166136261;
            for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
            return h >>> 0;
        };
        const corruptGlyph = (url) => hashUrl(url) % 6 === 0;
        const flipFirst = (bytes, status) => {
            if (bytes.length > 0) bytes[0] ^= 0xff;
            return new Response(bytes, { status });
        };
        const tamperFetch = async (url, opts = {}) => {
            const res = await fetch(url, opts);
            if (!res.ok) return res;
            const range = opts.headers?.Range; // 206 tile runs
            if (range) {
                const start = Number(/bytes=(\d+)-/.exec(range)?.[1]);
                if (!corruptTile(start)) return res;
                return flipFirst(new Uint8Array(await res.arrayBuffer()), 206);
            }
            // Plain GETs: only glyphs are corruptible. .car proofs and the
            // style body are single-sourced — tampering would blank the page
            // instead of demonstrating rejection.
            if (url.endsWith('.pbf') && corruptGlyph(url)) {
                return flipFirst(new Uint8Array(await res.arrayBuffer()), 200);
            }
            return res;
        };
        const fetchFn = tamper ? tamperFetch : undefined;

        // Two range-verified packages and two verified assets, one anchor each.
        const mapSource = new VerifiedSource({
            cid: config.map, source: sources('source', 'map.pmtiles'), fetchFn,
        });
        const elevationSource = new VerifiedSource({
            cid: config.elevation, source: sources('elevation', 'elevation.pmtiles'), fetchFn,
        });
        const fonts = new VerifiedAsset({
            cid: config.fonts, source: sources('fonts', 'assets/fonts'), fetchFn,
        });
        const styleAsset = new VerifiedAsset({
            cid: config.style, source: sources('style', 'assets/style.json'), fetchFn,
        });
        window.verified = { map: mapSource, elevation: elevationSource, fonts, style: styleAsset };

        // Order matters: every protocol must be registered before the map
        // requests pmtiles://<key> / verified://<anchor>/… / elevation://….
        const protocol = new pmtiles.Protocol();
        maplibregl.addProtocol('pmtiles', protocol.tile);
        protocol.add(new pmtiles.PMTiles(mapSource));
        maplibregl.addProtocol('verified', assetProtocol([fonts]));

        // The elevation archive rides the same pmtiles protocol, wrapped so a
        // tile absent from the archive (pure-ocean regions) rejects: MapLibre
        // then leaves that tile at sea level instead of choking on an empty
        // DEM payload.
        protocol.add(new pmtiles.PMTiles(elevationSource));
        maplibregl.addProtocol('elevation', async (params, abortController) => {
            const url = params.url.replace('elevation://', `pmtiles://${config.elevation}/`);
            const response = await protocol.tile({ ...params, url }, abortController);
            if (!response.data) {
                // Pure-ocean region: no DEM tile in the archive. Throwing (vs.
                // returning empty data) makes MapLibre leave the tile at sea
                // level instead of choking; the name marks it benign so the
                // error panel below doesn't log it.
                const err = new Error(`no elevation tile at ${params.url}`);
                err.name = 'ElevationAbsentError';
                throw err;
            }
            return response;
        });

        // The style is a verified raw asset: fetch, hash against STYLE_CID,
        // parse. Its pmtiles:// / verified:// / elevation:// references and the
        // raster-dem maxzoom were baked into it at build time from the same
        // CIDs and the elevation archive header.
        const style = JSON.parse(new TextDecoder().decode(await styleAsset.bytes('')));

        const map = new maplibregl.Map({
            container: 'map',
            style: style,
            center: [0, 20],
            zoom: 1.5,
            maxPitch: 85
        });
        map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));
        window.map = map; // console access

        const badge = document.getElementById('badge');
        let diagnostic = '';
        let withheld = 0; // responses that failed to fetch without a verification reject
        setInterval(() => {
            if (diagnostic) { badge.innerHTML = diagnostic; return; }
            const all = [mapSource, elevationSource, fonts, styleAsset];
            const verified = all.reduce((n, s) => n + s.stats.verified, 0);
            const rejected = all.reduce((n, s) => n + s.stats.rejected, 0);
            // Withheld vs tampered surface differently: a rejected hash is a
            // tamper; a withheld response is a fetch failure.
            badge.innerHTML = `✓ ${verified} hashes verified` +
                (rejected ? ` / <span class="rejected">✗ ${rejected} tampered</span>` : '') +
                (withheld ? ` / <span class="rejected">⚠ ${withheld} unavailable</span>` : '');
        }, 500);

        const findError = (err, name, depth = 0) => {
            if (!err || depth > 6) return null;
            if (err.name === name) return err;
            for (const e of err.errors ?? []) {
                const found = findError(e, name, depth + 1);
                if (found) return found;
            }
            return findError(err.cause, name, depth + 1);
        };
        map.on('error', (e) => {
            const err = e?.error;
            // A ranged fetch rejecting with TypeError after a plain GET already
            // succeeded is a CORS-preflight block (Firefox + a host that can't
            // allow Range): surface the exact diagnosis instead of a blank map.
            if (findError(err, 'RangeBlockedError')) {
                diagnostic = '<span class="rejected">✗ host refuses cross-origin range ' +
                    'requests in this browser</span>';
            } else if (findError(err, 'NotFoundError') || findError(err, 'ElevationAbsentError')) {
                // Authenticated absence: a glyph range the artifact does not
                // contain, or a DEM tile absent from the elevation archive
                // (pure ocean). assetProtocol already resolves absent glyph
                // ranges to empty and MapLibre renders ocean at sea level;
                // both are benign misses, not tampers — leave the badge alone.
            } else if (findError(err, 'AggregateError') && !findError(err, 'VerificationError')) {
                // A source failure with no verification reject = withholding.
                withheld++;
            } else if (!findError(err, 'VerificationError')) {
                // Verification rejects already show on the badge; registering an
                // error listener suppresses MapLibre's default logging, so pass
                // everything else through instead of swallowing it.
                console.error(err);
            }
        });
    </script>
</body>
</html>
